apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ds-plugin-bundle-poc-master
  namespace: ds-plugin-bundle-poc
spec:
  template:
    spec:
      volumes:
        - name: plugins-volume
          emptyDir: {}
      initContainers:
        - name: server-plugins-init
          image: apache/dolphinscheduler-server-plugins:dev-SNAPSHOT
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc", "cp -a /opt/dolphinscheduler/plugins/. /plugin-volume/"]
          volumeMounts:
            - name: plugins-volume
              mountPath: /plugin-volume
      containers:
        - name: ds-plugin-bundle-poc-master
          image: apache/dolphinscheduler-master:dev-SNAPSHOT-base
          volumeMounts:
            - name: plugins-volume
              mountPath: /opt/dolphinscheduler/plugins
