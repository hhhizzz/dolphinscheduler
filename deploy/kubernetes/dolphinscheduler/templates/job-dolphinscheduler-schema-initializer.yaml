{{- if and .Values.api.enabled }}
{{- $isInstall := .Release.IsInstall }}
{{- $usePreInstallHook := eq (include "dolphinscheduler.db_init.use_pre_install_hook" .) "true" }}
{{- $installAsRegularJob := and $isInstall (not $usePreInstallHook) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dolphinscheduler.fullname" . }}-db-init{{ ternary "-install" "" $installAsRegularJob }}-job
  labels:
    {{- include "dolphinscheduler.common.labels" . | nindent 4 }}
  {{- if not $installAsRegularJob }}
  annotations:
    "helm.sh/hook": {{ ternary "pre-install,pre-upgrade,pre-rollback" "pre-upgrade,pre-rollback" $usePreInstallHook }}
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  {{- if $installAsRegularJob }}
  ttlSecondsAfterFinished: 300
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "dolphinscheduler.common.labels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        {{- include "dolphinscheduler.database.wait-for-ready" . | nindent 6 }}
      containers:
        - name: {{ include "dolphinscheduler.fullname" . }}-db-init-job
          image: {{ include "dolphinscheduler.image.fullname.tools" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - tools/bin/upgrade-schema.sh
          env:
            - name: TZ
              value: {{ .Values.timezone }}
            - name: SPRING_JACKSON_TIME_ZONE
              value: {{ .Values.timezone }}
            {{- if $usePreInstallHook }}
            {{- include "dolphinscheduler.database.db_init_env_vars" . | nindent 12 }}
            {{- include "dolphinscheduler.registry.db_init_env_vars" . | nindent 12 }}
            {{- else }}
            {{- include "dolphinscheduler.database.env_vars" . | nindent 12 }}
            {{- include "dolphinscheduler.registry.env_vars" . | nindent 12 }}
            {{- end }}
          {{- if not $usePreInstallHook }}
          envFrom:
            - configMapRef:
                name: {{ include "dolphinscheduler.fullname" . }}-common
          {{- end }}
{{- end }}
